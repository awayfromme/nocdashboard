name: CI

on:
  push:
    branches:
      - main
      - agent/completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm run install-client
      - name: Run backend tests
        run: npm test
      - name: Run frontend tests
        run: npm run test:client
        env:
          CI: true
      - name: Lint backend and frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Audit backend dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical
      - name: Audit frontend dependencies for critical vulnerabilities
        run: npm audit --prefix client --audit-level=critical